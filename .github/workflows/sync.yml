name: Sync source code

# Config-driven, not hardcoded to one cluster: on every push, syncs the
# repo to every cluster in config/clusters.json that defines a sync_path
# (currently only the cluster-a simulator; LUIS/KISSKI/PC2 pick this up
# automatically once they're added with one). workflow_dispatch lets you target just one cluster instead.

on:
  push:
    branches: [main]
  workflow_dispatch:
    inputs:
      cluster:
        description: 'Cluster name (leave empty to sync every cluster with a sync_path)'
        required: false
        type: string

jobs:
  sync:
    runs-on: self-hosted
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Debug secret format
        run: echo "${{ secrets.SSH_PRIVATE_KEY }}" | cut -c1-15

      - name: Set up SSH agent
        run: |
          eval "$(ssh-agent -s)"
          echo "SSH_AUTH_SOCK=$SSH_AUTH_SOCK" >> "$GITHUB_ENV"
          echo "SSH_AGENT_PID=$SSH_AGENT_PID" >> "$GITHUB_ENV"
          mkdir -p ~/.ssh
          printf '%s\n' "${{ secrets.SSH_PRIVATE_KEY }}" > ~/.ssh/deploy_key
          chmod 600 ~/.ssh/deploy_key

          echo "--- Byte count ---"
          wc -c ~/.ssh/deploy_key

          echo "--- First/last bytes (hex) ---"
          od -c ~/.ssh/deploy_key | head -3
          od -c ~/.ssh/deploy_key | tail -3

          echo "--- ssh-keygen validation ---"
          ssh-keygen -y -f ~/.ssh/deploy_key -P "" || echo "SSH-KEYGEN SAYS: INVALID"

          ssh-add ~/.ssh/deploy_key
          
      - name: Sync
        run: ./scripts/sync.sh ${{ inputs.cluster }}

      - name: Stop SSH agent
        if: always()
        run: ssh-agent -k
