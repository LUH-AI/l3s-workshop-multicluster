name: Sync to LUIS

on:
  push:
    branches: [main]
  workflow_dispatch:

jobs:
  sync:
    runs-on: self-hosted
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up SSH key
        run: |
          mkdir -p ~/workshop-keys
          echo "${{ secrets.SSH_PRIVATE_KEY }}" > ~/workshop-keys/runner_key
          chmod 600 ~/workshop-keys/runner_key

      - name: Sync to LUIS
        run: ./scripts/sync.sh luis