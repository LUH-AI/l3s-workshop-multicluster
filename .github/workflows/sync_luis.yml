name: Sync to LUIS

on:
  push:
    branches: [main]
  workflow_dispatch:

jobs:
  sync:
    runs-on: self-hosted
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up SSH agent
        run: |
          eval "$(ssh-agent -s)"
          echo "SSH_AUTH_SOCK=$SSH_AUTH_SOCK" >> "$GITHUB_ENV"
          echo "SSH_AGENT_PID=$SSH_AGENT_PID" >> "$GITHUB_ENV"
          ssh-add - <<< "${{ secrets.SSH_PRIVATE_KEY }}"

      - name: Sync to LUIS
        run: ./scripts/sync.sh luis

      - name: Stop SSH agent
        if: always()
        run: ssh-agent -k