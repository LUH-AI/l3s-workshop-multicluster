name: Health

on:
  workflow_dispatch: {}

jobs:
  verify:
    name: Verify clusters
    runs-on: self-hosted
    steps:
      - uses: actions/checkout@v4
      - name: Set up SSH key
        run: |
          mkdir -p ~/workshop-keys
          echo "${{ secrets.SSH_PRIVATE_KEY }}" > ~/workshop-keys/runner_key
          chmod 600 ~/workshop-keys/runner_key
      - name: Preflight
        run: ./scripts/preflight.sh
      - name: Verify deployments
        run: ./scripts/verify.sh
