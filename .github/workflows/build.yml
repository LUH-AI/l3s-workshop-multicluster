name: Build placeholder container

# Builds and pushes an image ahead of/independent from the full deploy
# workflow, so groups that don't own WP2 (Containers) - i.e. WP1, WP3, WP4 -
# have something real in GHCR to point deploy.sh/verify.sh at before WP2 is
# actually done. Pushes two tags: the Git SHA (traceable) and a stable
# `dummy` tag (so you don't need to know/look up a SHA to use it).
#
# Trigger it once manually (Actions -> Build placeholder container -> Run
# workflow) to seed GHCR before group work starts. It also runs on every
# push to main, so the dummy tag stays reasonably fresh without anyone
# having to remember to re-trigger it.

on:
  workflow_dispatch: {}
  push:
    branches: [main]

jobs:
  build:
    runs-on: self-hosted
    steps:
      - uses: actions/checkout@v4

      - name: Set image tag
        id: vars
        run: echo "tag=$(git rev-parse --short HEAD)" >> "$GITHUB_OUTPUT"

      - name: Build image
        run: |
          docker build \
            --build-arg GIT_SHA=${{ steps.vars.outputs.tag }} \
            -t ghcr.io/${{ github.repository_owner }}/project:${{ steps.vars.outputs.tag }} \
            -t ghcr.io/${{ github.repository_owner }}/project:dummy \
            .

      - name: Push image
        run: |
          echo "${{ secrets.GHCR_TOKEN }}" | docker login ghcr.io -u ${{ github.actor }} --password-stdin
          docker push ghcr.io/${{ github.repository_owner }}/project:${{ steps.vars.outputs.tag }}
          docker push ghcr.io/${{ github.repository_owner }}/project:dummy

      - name: Summary
        run: |
          {
            echo "### Placeholder image pushed"
            echo
            echo "- \`ghcr.io/${{ github.repository_owner }}/project:${{ steps.vars.outputs.tag }}\`"
            echo "- \`ghcr.io/${{ github.repository_owner }}/project:dummy\` (stable tag - use this if you don't need a specific commit)"
          } >> "$GITHUB_STEP_SUMMARY"
