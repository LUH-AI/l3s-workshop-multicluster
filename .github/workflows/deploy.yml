name: Multi-Cluster Deploy

on:
  workflow_dispatch:
    inputs:
      deploy_cluster_a:
        description: 'Cluster A'
        type: boolean
        default: true
      deploy_cluster_b:
        description: 'Cluster B'
        type: boolean
        default: false
      build_container:
        description: 'Build container'
        type: boolean
        default: true

jobs:
  build:
    if: ${{ inputs.build_container }}
    runs-on: self-hosted
    outputs:
      tag: ${{ steps.vars.outputs.tag }}
    steps:
      - uses: actions/checkout@v4

      - name: Set image tag
        id: vars
        run: echo "tag=$(git rev-parse --short HEAD)" >> "$GITHUB_OUTPUT"

      - name: Build image
        run: docker build -t ghcr.io/evavormschlag/project:${{ steps.vars.outputs.tag }} .

      - name: Push image
        run: |
          echo "${{ secrets.GHCR_TOKEN }}" | docker login ghcr.io -u ${{ github.actor }} --password-stdin
          docker push ghcr.io/evavormschlag/project:${{ steps.vars.outputs.tag }}

  deploy-cluster-a:
    needs: build
    if: ${{ inputs.deploy_cluster_a }}
    runs-on: self-hosted
    steps:
      - uses: actions/checkout@v4
      - run: ./scripts/deploy.sh cluster-a ${{ needs.build.outputs.tag }}

  deploy-cluster-b:
    needs: build
    if: ${{ inputs.deploy_cluster_b }}
    runs-on: self-hosted
    steps:
      - uses: actions/checkout@v4
      - run: ./scripts/deploy.sh cluster-b ${{ needs.build.outputs.tag }}

  verify:
    needs: [build, deploy-cluster-a, deploy-cluster-b]
    if: always()
    runs-on: self-hosted
    steps:
      - uses: actions/checkout@v4
      - run: ./scripts/verify.sh ${{ needs.build.outputs.tag }}