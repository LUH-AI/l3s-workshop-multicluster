name: Multi-Cluster Deploy

on:
  workflow_dispatch:
    inputs:
      deploy_cluster_a:
        description: 'Cluster A'
        type: boolean
        default: true
      build_container:
        description: 'Build container'
        type: boolean
        default: true

jobs:
  build:
    if: ${{ inputs.build_container }}
    runs-on: self-hosted
    outputs:
      tag: ${{ steps.vars.outputs.tag }}
    steps:
      - uses: actions/checkout@v4

      - name: Set image tag
        id: vars
        run: echo "tag=$(git rev-parse --short HEAD)" >> "$GITHUB_OUTPUT"

      # Uses github.repository_owner (= your own username in your fork), so
      # nothing here needs manual editing - unlike REGISTRY in
      # scripts/deploy.sh and scripts/verify.sh, which you do have to set
      # to your own username (see README / WP0).
      - name: Build image
        run: docker build -t ghcr.io/${{ github.repository_owner }}/project:${{ steps.vars.outputs.tag }} .

      - name: Push image
        run: |
          echo "${{ secrets.GHCR_TOKEN }}" | docker login ghcr.io -u ${{ github.actor }} --password-stdin
          docker push ghcr.io/${{ github.repository_owner }}/project:${{ steps.vars.outputs.tag }}

  deploy-cluster-a:
    needs: build
    if: ${{ always() && inputs.deploy_cluster_a && !failure() && !cancelled() }}
    runs-on: self-hosted
    steps:
      - uses: actions/checkout@v4
      - name: Set up SSH agent
        run: |
          eval "$(ssh-agent -s)"
          echo "SSH_AUTH_SOCK=$SSH_AUTH_SOCK" >> "$GITHUB_ENV"
          echo "SSH_AGENT_PID=$SSH_AGENT_PID" >> "$GITHUB_ENV"
          ssh-add - <<< "${{ secrets.SSH_PRIVATE_KEY }}"
      - run: ./scripts/deploy.sh cluster-a ${{ needs.build.outputs.tag }}
        env:
          GHCR_USER: ${{ github.actor }}
          GHCR_TOKEN: ${{ secrets.GHCR_TOKEN }}
      - name: Stop SSH agent
        if: always()
        run: ssh-agent -k

  verify:
    needs: [build, deploy-cluster-a]
    if: always()
    runs-on: self-hosted
    steps:
      - uses: actions/checkout@v4
      - name: Set up SSH agent
        run: |
          eval "$(ssh-agent -s)"
          echo "SSH_AUTH_SOCK=$SSH_AUTH_SOCK" >> "$GITHUB_ENV"
          echo "SSH_AGENT_PID=$SSH_AGENT_PID" >> "$GITHUB_ENV"
          ssh-add - <<< "${{ secrets.SSH_PRIVATE_KEY }}"
      - run: ./scripts/verify.sh ${{ needs.build.outputs.tag }}
      - name: Stop SSH agent
        if: always()
        run: ssh-agent -k

  summary:
    needs: [build, deploy-cluster-a, verify]
    if: always()
    runs-on: self-hosted
    steps:
      - name: Write job summary
        run: |
          {
            echo "### Deploy summary"
            echo
            echo "| Job | Result |"
            echo "|---|---|"
            echo "| Build | ${{ needs.build.result }} |"
            echo "| Cluster A | ${{ needs.deploy-cluster-a.result }} |"
            echo "| Verify | ${{ needs.verify.result }} |"
          } >> "$GITHUB_STEP_SUMMARY"
